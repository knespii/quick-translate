# Copy to ~/.config/quick-translate/config.toml and change what you need.

[ui]
rows = 7            # visible result rows
width = 680

[prefill]
enabled = true      # prefill the query from the selected (PRIMARY) text
max_chars = 80          # a word or phrase: single line, up to this many characters
max_paragraph_chars = 2000  # paragraph mode: longer / multi-line selections up to this (max 2000), cut at a
                            # sentence end; a selection over 3x this (e.g. Ctrl+A on a page) is ignored

[mt]
enabled = true      # offline phrase translation (Bergamot)
debounce_ms = 120

[paragraph]
auto_llm = true     # Czech -> English paragraphs: when you stop typing, the local LLM polishes the machine translation
                    # (English -> Czech stays machine-translated; the LLM only on Alt+E)

[history]
enabled = true      # recently translated words (Tab); the history stays on this computer

[diacritics]
enabled = true      # Czech typed without diacritics gets them back: each finished word is corrected in the input
                    # ('mas ' -> 'máš ', Ctrl+Z undoes it); the translators get the text with diacritics

[rewrite]
enabled = true      # Super+R: rewrite the selected text in another tone with the [llm] ollama (local: nothing leaves
                    # the computer unless [llm] url points elsewhere)
model = ""          # empty: the [llm] model; a bigger one writes better Czech if your GPU has room for it
max_chars = 8000    # longer texts are refused with a note (about a long e-mail)
num_ctx = 8192      # the model's context in tokens (all its requests): the text and its rewrite must fit

[online]
enabled = true      # Alt+L asks LINDAT (MFF UK); nothing is sent without Alt+L
timeout = 4

[llm]
model = "gemma3:4b"
url = "http://127.0.0.1:11434"
keep_alive = "10m"
timeout = 60
